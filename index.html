  Um único arquivo. Abra no Chrome, Edge, Firefox ou Safari recentes. Funciona sem internet.
  Os dados ficam só neste computador, no armazenamento do navegador, até você fechar a tabela.
  Visual e regras do protótipo do Canis (Claude Design): cores 4Network, listas, saúde do registro (docs 03 e 08).
-->
<style>
/* ---------- Tokens do protótipo (cores 4Network, D-38). Todo texto atinge pelo menos 4,5:1 nos dois temas. ---------- */
:root{--font:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--radius:10px;--radius-sm:7px;--radius-lg:14px;--dur:160ms;--dur-slow:200ms;color-scheme:light;
--background:#ffffff;--foreground:#1e2324;--popover:#ffffff;--muted:oklch(0.965 0.007 125);--muted-foreground:#4a5250;--accent:oklch(0.952 0.01 125);--border:oklch(0.905 0.008 125);--border-soft:oklch(0.938 0.007 125);--border-strong:oklch(0.84 0.01 125);--input:oklch(0.6 0.012 180);--field:#ffffff;--ring:#5c8f22;--primary:#8dc63f;--primary-foreground:#1e2324;--link:#4d7c0f;--overlay:oklch(0.2 0.01 210 / 0.28);--hov:oklch(0.2 0.01 210 / 0.06);--hl:oklch(0.92 0.08 128);--row-hover:oklch(0.976 0.007 125);--row-sel:oklch(0.966 0.024 128);--table-head:oklch(0.98 0.005 125);--sidebar:#f6f8f3;--sidebar-fg:oklch(0.32 0.012 200);--sidebar-active:oklch(0.92 0.06 128);--brand-fg:#4d7c0f;--brand-bg:oklch(0.968 0.032 128);--brand-bd:oklch(0.85 0.09 128);--crit-fg:#b91c1c;--crit-bg:oklch(0.965 0.025 27);--crit-bd:oklch(0.86 0.07 27);--crit-solid:oklch(0.52 0.2 27);--crit-on:oklch(0.99 0 0);--warn-fg:#b45309;--warn-bg:oklch(0.97 0.04 85);--warn-bd:oklch(0.86 0.09 80);--warn-solid:oklch(0.72 0.15 70);--info-fg:#1d4ed8;--info-bg:oklch(0.965 0.02 250);--info-bd:oklch(0.86 0.05 250);--ok-fg:#0f766e;--ok-bg:oklch(0.965 0.025 186);--ok-bd:oklch(0.85 0.06 186);--shadow-sm:0 1px 2px oklch(0.2 0.01 210 / 0.08);--shadow-lg:0 16px 48px oklch(0.2 0.01 210 / 0.16),0 2px 6px oklch(0.2 0.01 210 / 0.08)}
:root[data-theme="dark"]{color-scheme:dark;
--background:#1e2324;--foreground:#e8ecea;--popover:#262c2d;--muted:oklch(0.31 0.009 208);--muted-foreground:#a8b2ae;--accent:oklch(0.33 0.01 208);--border:oklch(0.36 0.01 208);--border-soft:oklch(0.31 0.009 208);--border-strong:oklch(0.44 0.012 208);--input:oklch(0.62 0.014 190);--field:oklch(0.27 0.009 208);--ring:#8dc63f;--primary:#8dc63f;--primary-foreground:#1e2324;--link:#8dc63f;--overlay:oklch(0.05 0.01 210 / 0.6);--hov:oklch(1 0 0 / 0.07);--hl:oklch(0.45 0.09 128);--row-hover:oklch(0.285 0.009 208);--row-sel:oklch(0.32 0.04 140);--table-head:oklch(0.27 0.009 208);--sidebar:oklch(0.225 0.008 210);--sidebar-fg:oklch(0.88 0.006 170);--sidebar-active:oklch(0.34 0.05 135);--brand-fg:#8dc63f;--brand-bg:oklch(0.32 0.06 128);--brand-bd:oklch(0.46 0.1 128);--crit-fg:#fca5a5;--crit-bg:oklch(0.31 0.06 25);--crit-bd:oklch(0.47 0.11 25);--crit-solid:oklch(0.52 0.19 27);--warn-fg:#fcd34d;--warn-bg:oklch(0.32 0.05 70);--warn-bd:oklch(0.5 0.09 70);--warn-solid:oklch(0.75 0.14 70);--info-fg:#93c5fd;--info-bg:oklch(0.31 0.05 250);--info-bd:oklch(0.47 0.08 250);--ok-fg:#5eead4;--ok-bg:oklch(0.31 0.05 186);--ok-bd:oklch(0.47 0.08 186);--shadow-sm:0 1px 2px oklch(0 0 0 / 0.4);--shadow-lg:0 16px 48px oklch(0 0 0 / 0.5),0 2px 6px oklch(0 0 0 / 0.3)}

/* ---------- Base ---------- */
html,body{margin:0;height:100%;background:var(--background);color:var(--foreground);font-family:var(--font);-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ring);outline-offset:0;border-color:var(--ring)!important}
a{color:var(--link)}
::selection{background:var(--hl)}
::placeholder{color:var(--muted-foreground);opacity:.85}
svg{display:block;flex-shrink:0}
mark{background:var(--hl);color:inherit;border-radius:2px}
input[type=checkbox],input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
@keyframes canis-slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes canis-pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes canis-fade{from{opacity:0}to{opacity:1}}
@keyframes canis-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sp{flex:1 1 auto}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted-foreground)}
.mono{font-family:var(--mono);font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--muted-foreground);font-size:.875rem;font-variant-numeric:tabular-nums}
.small{font-size:.75rem}
.fg-critico{color:var(--crit-fg)}.fg-atencao{color:var(--warn-fg)}.fg-info{color:var(--info-fg)}.fg-ok{color:var(--ok-fg)}

/* ---------- Estrutura: barra lateral, topo, área principal ---------- */
.app{display:flex;height:100vh}
.side{width:232px;flex:0 0 auto;display:flex;flex-direction:column;gap:2px;background:var(--sidebar);border-right:1px solid var(--border);padding:12px 10px;height:100vh}
.logo{display:flex;align-items:center;gap:8px;height:36px;margin-bottom:14px;padding:0 2px 0 4px;font-weight:700;font-size:1rem;letter-spacing:-.01em}
.logo-c{width:24px;height:24px;border-radius:7px;background:var(--primary);color:var(--primary-foreground);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:.6875rem;font-weight:600;background:var(--brand-bg);color:var(--brand-fg);border:1px solid var(--brand-bd)}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;color:var(--sidebar-fg);background:transparent;text-align:left}
.nav:hover{background-image:linear-gradient(var(--hov),var(--hov))}
.nav[aria-current="page"]{font-weight:600;color:var(--foreground);background:var(--sidebar-active)}
.nav.small{height:30px;font-size:.8125rem;color:var(--muted-foreground)}
.nav .lbl{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--crit-solid);color:var(--crit-on);font-size:.6875rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.qtd{font-size:.75rem;font-weight:500;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.side.min{width:56px;padding:12px 8px}
.side.min .logo{flex-direction:column;height:auto;gap:4px;margin-bottom:10px;padding:0}
.side.min .nav{justify-content:center;padding:0;position:relative}
.side.min .lbl,.side.min .qtd{display:none}
.side.min .count{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;font-size:.625rem}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--border)}
.body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;height:100vh}
.top{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--background)}
.filechip{display:inline-flex;align-items:center;gap:8px;font-size:.875rem;min-width:0;color:var(--muted-foreground)}
.filechip b{font-weight:600;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw}
.salvo{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted-foreground);margin-left:10px;white-space:nowrap}
.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
.head{padding:20px 24px 0;display:flex;flex-direction:column;gap:12px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.375rem;font-weight:650;letter-spacing:-.015em}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px}

/* ---------- Botões, campos e selos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--radius-sm);font-size:.8125rem;font-weight:500;white-space:nowrap;border:1px solid var(--border-strong);background:var(--background);color:var(--foreground);transition:background-color var(--dur),color var(--dur),border-color var(--dur);line-height:1;flex-shrink:0;text-decoration:none}
.btn:hover{background:var(--accent)}
.btn.md{height:36px;padding:0 14px;font-size:.875rem}
.btn.xs{height:28px;padding:0 8px}
.btn.primary,.btn.on{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
.btn.primary:hover,.btn.on:hover{background-image:linear-gradient(var(--hov),var(--hov))}
.btn.danger{background:var(--crit-solid);color:var(--crit-on);border-color:transparent}
.btn.danger:hover{background-image:linear-gradient(var(--hov),var(--hov))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--accent)}
.btn.dashed{border-style:dashed}
.btn.icon{width:32px;padding:0}
.btn.icon.xs{width:28px}
.btn .n{font-variant-numeric:tabular-nums;font-weight:600;opacity:.85}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.link{border:0;background:transparent;color:var(--link);padding:0 2px;min-height:24px;font-size:.8125rem;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.input,.select{height:32px;padding:0 10px;border:1px solid var(--input);border-radius:var(--radius-sm);background:var(--field);font-size:.8125rem;min-width:0}
.input{width:100%}
.select{padding:0 6px}
.search{position:relative;width:min(340px,100%)}
.search>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);pointer-events:none}
.search .input{padding:0 30px 0 32px}
.search .btn{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:26px;height:26px;color:var(--muted-foreground)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:.75rem;font-weight:500;line-height:1;white-space:nowrap;border:1px solid var(--border);color:var(--muted-foreground);background:var(--muted)}
.t-critico{color:var(--crit-fg);background:var(--crit-bg);border-color:var(--crit-bd)}
.t-atencao{color:var(--warn-fg);background:var(--warn-bg);border-color:var(--warn-bd)}
.t-info{color:var(--info-fg);background:var(--info-bg);border-color:var(--info-bd)}
.t-ok{color:var(--ok-fg);background:var(--ok-bg);border-color:var(--ok-bd)}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex-shrink:0}
.dot-critico{background:var(--crit-solid)}.dot-atencao{background:var(--warn-solid)}.dot-info{background:var(--info-fg)}
.chip{display:inline-flex;align-items:center;height:32px;max-width:420px;border-radius:var(--radius-sm);background:var(--brand-bg);border:1px solid var(--brand-bd);color:var(--brand-fg);font-size:.8125rem;font-weight:500}
.chip>button{height:30px;padding:0 6px 0 10px;border:0;background:transparent;color:inherit;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip>button.x{width:26px;height:26px;padding:0;margin-right:2px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.chip>button.x:hover{background:var(--hov)}
.note{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--info-bd);background:var(--info-bg);font-size:.8125rem;line-height:1.45}
.note>svg{margin-top:1px;color:var(--info-fg)}
.note.warn{border-color:var(--warn-bd);background:var(--warn-bg)}.note.warn>svg{color:var(--warn-fg)}
.note.neutral{border-color:var(--border);background:var(--muted)}.note.neutral>svg{color:var(--muted-foreground)}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--background)}
.sec-t{margin:0 0 8px;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 24px;text-align:center;color:var(--muted-foreground)}
.empty p{margin:0;font-size:.9375rem;color:var(--foreground)}

/* ---------- Tabela ---------- */
.wrap{flex:1 1 auto;min-height:0;overflow:auto;border-top:1px solid var(--border)}
.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%;font-size:.875rem}
.grid.compacta{font-size:.8125rem}
.grid th{position:sticky;top:0;z-index:3;background:var(--table-head);padding:0;border-bottom:1px solid var(--border);text-align:left}
.grid th.stk{z-index:5}
.thw{position:relative;display:flex;align-items:center}
.thb{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 auto;height:36px;padding:0 6px 0 12px;border:0;background:transparent;font-size:.75rem;font-weight:600;color:var(--muted-foreground);white-space:nowrap}
.thb:hover{color:var(--foreground)}
.thb .tl{overflow:hidden;text-overflow:ellipsis}
.thb .ic{display:inline-flex;opacity:.45}.thb .ic.on{opacity:1}
.thb .on-n{font-size:.625rem;font-weight:700}
.hcount{height:18px;min-width:18px;margin-right:12px;padding:0 6px;border-radius:999px;border:1px solid;font-size:.6875rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.resize{position:absolute;right:0;top:6px;bottom:6px;width:7px;cursor:col-resize;border-right:2px solid transparent}
.resize:hover{border-right-color:var(--ring)}
.grid td{padding:10px 12px;border-bottom:1px solid var(--border-soft);background:var(--background);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.grid.compacta td{padding:5px 12px}
.grid .stk{position:sticky}
.grid td.stk{z-index:1}
.grid .sombra{box-shadow:inset -1px 0 0 var(--border)}
.grid tr:hover td{background:var(--row-hover)}
.grid tr.sel td,.grid tr.atual td{background:var(--row-sel)}
.grid tr.del td.dado{color:var(--muted-foreground);text-decoration:line-through}
.grid td.f-critico,.grid tr:hover td.f-critico{background:var(--crit-bg)}
.grid td.f-atencao,.grid tr:hover td.f-atencao{background:var(--warn-bg)}
.grid td.f-info{text-decoration:underline dotted var(--info-fg);text-underline-offset:3px}
.grid td.ed:not(.stk){position:relative} /* a célula fixa já é posicionada (sticky) */
.grid td.ed::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--primary) transparent transparent}
.grid .vazio{color:var(--crit-fg);font-style:italic;font-size:.75rem}
.grid td.der{color:var(--muted-foreground)} /* vem da empresa ligada */
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 24px;border-top:1px solid var(--border);font-size:.8125rem;color:var(--muted-foreground)}
.bulk{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);width:max-content;z-index:12;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:var(--radius-lg);background:var(--popover);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);animation:canis-fade var(--dur) ease-out;max-width:calc(100% - 32px);flex-wrap:wrap}
.bulk strong{font-size:.8125rem;white-space:nowrap}
.vsep{width:1px;height:20px;background:var(--border)}
.selbanner{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 24px;background:var(--brand-bg);border-top:1px solid var(--brand-bd);font-size:.8125rem}

/* ---------- Revisão ---------- */
.levels{display:flex;gap:10px;flex-wrap:wrap}
.level{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);border:1px solid;font-size:.875rem;font-weight:600}
.level .n{font-size:1.125rem;font-variant-numeric:tabular-nums;margin-left:4px}
.level[aria-pressed="true"]{box-shadow:0 0 0 2px currentColor inset}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types .btn{gap:8px}

/* ---------- Camadas: gaveta, diálogo, popover, avisos ---------- */
.backdrop{position:fixed;inset:0;background:var(--overlay);animation:canis-fade var(--dur) ease-out}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,calc(100vw - 72px));z-index:40;background:var(--background);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:canis-slide var(--dur-slow) ease-out}
.dr-h{flex:0 0 auto;padding:16px 16px 14px 24px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.dr-h h2{margin:0;font-size:1.25rem;font-weight:650;letter-spacing:-.01em}
.dr-b{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:18px}
.dr-f{flex:0 0 auto;padding:12px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.fields{display:flex;flex-direction:column;padding:6px 0}
.fld{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;padding:6px 14px;align-items:start}
.fld>label{padding-top:8px;font-size:.8125rem;color:var(--muted-foreground);overflow-wrap:anywhere}
.fld .input{height:34px;font-size:.875rem}
.fld textarea.input{height:auto;padding:6px 10px;line-height:1.45;resize:vertical;font-family:inherit} /* célula com mais de uma linha */
.fld.f-critico .input{border-color:var(--crit-fg)}.fld.f-atencao .input{border-color:var(--warn-fg)}
.msg{font-size:.75rem;margin-top:4px;line-height:1.4}
.req{color:var(--crit-fg);margin-left:3px}
.orig{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.75rem;color:var(--muted-foreground);margin-top:4px}
.probs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prob{display:flex;gap:10px;align-items:flex-start;font-size:.875rem;line-height:1.4}
.prob>svg{margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.banner{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius);background:var(--muted);border:1px solid var(--border);font-size:.8125rem}
.vinc{padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:.875rem}
.pessoas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.8125rem}
.pessoas li{display:flex;align-items:baseline;gap:8px;min-width:0}
.pessoas li .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);max-height:calc(100vh - 48px);z-index:50;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:canis-pop var(--dur) ease-out}
.dlg-h{flex:0 0 auto;padding:16px 16px 14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.dlg-h h2{margin:0;font-size:1.25rem;font-weight:650;letter-spacing:-.01em}
.dlg-b{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 24px;display:flex;flex-direction:column;gap:16px}
.dlg-f{flex:0 0 auto;padding:12px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.flabel{font-size:.8125rem;font-weight:600;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border-strong);border-radius:var(--radius);cursor:pointer;background:var(--background)}
.opt:has(input:checked){border-color:var(--brand-bd);background:var(--brand-bg)}
.opt input{margin-top:1px}
.opt b{display:block;font-weight:500;font-size:.875rem}
.opt small{display:block;color:var(--muted-foreground);font-size:.75rem;margin-top:3px;line-height:1.4}
.check{display:flex;align-items:center;gap:8px;font-size:.875rem;cursor:pointer;line-height:1.35}
.checks{display:flex;flex-direction:column;gap:10px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:.8125rem;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.8125rem}
.prev li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{position:fixed;z-index:90;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:8px;display:flex;flex-direction:column;gap:6px;animation:canis-fade var(--dur) ease-out;overflow:hidden}
.pop-h{display:flex;align-items:center;gap:6px;padding:2px 4px;font-size:.8125rem}
.menu{display:flex;flex-direction:column;gap:1px;overflow:auto;min-height:0;max-height:320px}
.mi{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:6px 8px;border:0;border-radius:6px;background:transparent;font-size:.8125rem;text-align:left;color:var(--foreground);cursor:pointer}
.mi:hover{background:var(--accent)}
.mi .tl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .hint{font-size:.6875rem;color:var(--muted-foreground);white-space:nowrap}
.pop-sep{height:1px;background:var(--border);margin:2px 0}
.toasts{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toasts.desvio{right:calc(min(580px,100vw - 72px) + 16px)}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;padding:12px 10px 12px 14px;border-radius:var(--radius);background:var(--popover);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);font-size:.875rem;animation:canis-fade var(--dur) ease-out}
.toast>svg{margin-top:1px}
.loading{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center}
.loading-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:var(--radius);background:var(--popover);box-shadow:var(--shadow-lg);font-size:.875rem}
.spinner{width:18px;height:18px;border-radius:999px;border:2px solid var(--border-strong);border-top-color:var(--primary);animation:canis-spin .8s linear infinite}

/* ---------- Início e mapeamento ---------- */
.start{flex:1 1 auto;overflow:auto;display:flex;justify-content:center;padding:48px 24px}
.start-in{width:min(680px,100%);display:flex;flex-direction:column;gap:16px}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 24px;border:2px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--muted);text-align:center}
.drop.over{border-color:var(--ring);background:var(--brand-bg)}
.resume{display:flex;align-items:center;gap:12px;padding:12px 14px}
.page{flex:1 1 auto;min-height:0;overflow:auto;padding-bottom:24px}
.secao{padding:0 24px 20px}
.ctl{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:500}
.mtbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.875rem;border:1px solid var(--border);border-radius:var(--radius)}
.mtbl th{background:var(--table-head);text-align:left;font-size:.75rem;font-weight:600;color:var(--muted-foreground);padding:9px 12px;border-bottom:1px solid var(--border)}
.mtbl th:first-child{border-top-left-radius:var(--radius)}.mtbl th:last-child{border-top-right-radius:var(--radius)}
.mtbl td{padding:7px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.mtbl tr:last-child td{border-bottom:0}
.mtbl td.ex{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8125rem}
.mtbl tr.off td:not(.dest){opacity:.55}
.mtbl .nome{width:210px;max-width:100%}
.conf{display:inline-flex;vertical-align:-2px;margin-right:4px;color:var(--ok-fg)} /* linha conferida */
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hitem{padding:10px 12px}
.hdet{margin-top:10px;max-height:420px;overflow:auto}
.hdet .mtbl td{vertical-align:top;font-size:.8125rem}
/* Resumo da limpeza (Histórico) */
.resumo{display:flex;flex-direction:column;gap:12px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px;align-items:start}
.rcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard .sec-t{margin:4px 0 0}
.rtit{margin:0;font-size:1rem;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rbox{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px;border-radius:var(--radius);background:var(--muted)}
.rnum{font-size:1.375rem;font-weight:600;font-variant-numeric:tabular-nums}
.barra{align-self:stretch;height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.barra>span{display:block;height:100%;background:var(--ok-fg);border-radius:99px}
.rtbl th.num,.rtbl td.num{text-align:right;width:84px}
.rtbl tr.feito td{color:var(--muted-foreground)}.rtbl tr.feito td.num b{color:var(--ok-fg)} /* problema que sumiu */
.rtbl tr.total td{border-top:1px solid var(--border)}
.rcols{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.8125rem}
.rcols li{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:8px;align-items:center}
.rc-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-b{height:6px;border-radius:99px;background:var(--border-soft);overflow:hidden}.rc-b>span{display:block;height:100%;background:var(--primary)}
.rcols .num{text-align:right}
.mtbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mtbl .select{width:250px;max-width:100%}
.mtbl .link{white-space:nowrap}

/* ---------- Duplicados e mescla ---------- */
.dups{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 24px 24px;display:flex;flex-direction:column;gap:12px}
.dcard{overflow:hidden;flex:0 0 auto}
.dcard-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px 10px 14px;border-bottom:1px solid var(--border);background:var(--table-head)}
.dcard-b{overflow-x:auto}
.mini{border-collapse:separate;border-spacing:0;font-size:.8125rem;min-width:100%}
.mini th{text-align:left;font-size:.75rem;font-weight:600;color:var(--muted-foreground);padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.mini td{padding:7px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.mini tr:last-child td{border-bottom:0}
.mini td.dif{background:var(--warn-bg)}
.mwrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius)}
.mtab{border-collapse:separate;border-spacing:0;font-size:.8125rem;width:100%}
.mtab th,.mtab td{padding:8px 12px;border-bottom:1px solid var(--border-soft);text-align:left;vertical-align:top}
.mtab thead th{background:var(--table-head);position:sticky;top:0;z-index:1}
.mtab tbody th{font-weight:500;color:var(--muted-foreground);white-space:nowrap;width:1%}
.mtab td{max-width:280px;overflow-wrap:anywhere}
.mtab td.on{background:var(--brand-bg)}
.mtab tr.eq td,.mtab tr.eq th{color:var(--muted-foreground)}
.mtab .check{align-items:flex-start;font-size:.8125rem}
.mtab .check input{margin-top:1px}
</style>
</head>

<script id="regras">
'use strict';
/* =====================================================================
   Regras compartilhadas do Canis e do Laika (D-58)
   Fonte única, em código, de:
     1. listas controladas (doc 02, Listas controladas);
     2. campos do layout de importação e exportação (doc 08, §2);
     3. detecção de problemas nos valores, com o nível de cada um (doc 03);
     4. problemas da pessoa que comparam campos, ou a pessoa com a empresa dela (RN-VIN-001, RN-PES-011, RN-PES-012),
        e da empresa sem relacionamento (RN-EMP-007);
     5. critérios de duplicados (RN-DUP-001 e RN-DUP-002);
     6. nomes do Censo 2010 para o aviso de gênero diferente do nome (RN-PES-011);
     7. campos obrigatórios na importação do Canis (D-09).
   O que muda entre os produtos fica fora daqui. O Canis bloqueia ao salvar e na importação o que é
   crítico e o obrigatório vazio (D-09). O Laika só aponta problemas, sem campo obrigatório, conta no aviso
   da exportação o que o Canis recusaria e oferece as ferramentas de limpeza (D-58). O campo acao de cada problema diz qual
   ferramenta resolve, e cada produto mostra a sua dica.
   Roda no navegador e no Node, sem bibliotecas e sem DOM: tests/regras.test.cjs carrega este bloco direto de index.html.
   Para mudar uma regra, lista ou coluna: primeiro docs/regras.md, depois este bloco e tests/regras.test.cjs.
   Os IDs (RN-*, D-*, Q-*) vêm da especificação do Canis; docs/regras.md explica cada um que o Laika usa.
   ===================================================================== */

/* ---------- 1. Texto ---------- */
const norm = s => (s ?? '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const chave = s => norm(s).replace(/[^a-z0-9]+/g, ' ').trim();
const vazio = v => String(v ?? '').trim() === '';

/* ---------- 2. Listas controladas (doc 02, Listas controladas) ----------
   Valores iniciais do Canis e listas do Laika, com os rótulos em português que saem nos arquivos.

const LISTAS = {

  nivel: ['1 C-level', '2 Diretoria', '3 Gerência'],
  alcance: ['Nacional', 'Internacional'],
  genero: ['Feminino', 'Masculino', 'Outro', 'Prefiro não informar'],
  idioma: ['Português', 'Inglês', 'Espanhol'],
  status: ['Ativo', 'Inativo', 'Arquivado'],
  motivo: ['Duplicado', 'Empresa encerrada', 'Empresa adquirida ou incorporada', 'Saiu do mercado', 'Pedido do titular (LGPD)', 'Dado inválido', 'Falecido', 'Aposentado', 'Outro'],
  porte: ['1 a 49', '50 a 249', '250 a 999', '1.000 a 4.999', '5.000 ou mais'],
  metrica: ['Faturamento', 'Investimento em TI', 'Receita líquida', 'Valor empenhado', 'Valor orçado', 'Valor licitado', 'Faturamento (pesquisa)', 'Investimento em TI (pesquisa)', 'OPEX', 'CAPEX'],
  moeda: ['BRL', 'ARS', 'CLP', 'COP', 'MXN', 'PEN', 'USD'],
  fonte: ['Relatório publicado', 'Informado pela empresa', 'Estimativa interna', 'Fonte de mercado', 'Migração Sirius'],
  confianca: ['Alta', 'Média', 'Baixa'],
};
const foraDaLista = (lista, v) => !LISTAS[lista].some(x => norm(x) === norm(v));
/* Listas abertas: valor de fora entra como valor novo. Categoria (RN-EMP-006): o usuário cria uma categoria nova quando nenhuma serve */
const LISTAS_ABERTAS = new Set(['categoria']);

/* ---------- 3. Campos do layout de importação e exportação (doc 08, §2) ----------

/* Mapeamento: cada coluna do arquivo vai para um campo do modelo, fica como está, ou é ignorada */
const linhasImp = imp => imp.folhas[imp.planilha].linhas;
function contarLinhas(imp) { const L = linhasImp(imp); let n = 0; for (let i = imp.cab + 1; i < L.length; i++) if (linhaComDados(L[i])) n++; return n; }
function exemplos(imp, i) { const L = linhasImp(imp), out = []; for (let j = imp.cab + 1; j < L.length && j < imp.cab + 500 && out.length < 3; j++) { const v = limpo((L[j] || [])[i]); if (v && !ehMarcador(v) && !out.includes(v)) out.push(v); } return out; }
function cabecalhoProvavel(imp) { const L = linhasImp(imp); for (let i = 0; i < Math.min(L.length, 30); i++) if (L[i] && L[i].filter(v => !vazio(v)).length >= 2) return i; for (let i = 0; i < L.length; i++) if (L[i] && L[i].some(v => !vazio(v))) return i; return 0; }
/* Campo pelo nome da coluna (chave, rótulo ou sinônimo). No modelo combinado devolve 'p:campo' ou 'e:campo', procurando antes em Pessoas. */
function campoProvavel(modelo, titulo) {
  const t = chave(titulo); if (!t) return null;
  const achar = campos => (campos.find(f => t === f.key.replace(/_/g, ' ') || t === chave(f.label) || (f.sin || []).includes(t)) || {}).key;
  if (modelo !== 'combinado') return achar(MODELOS[modelo].campos) || null;
  const p = achar(camposComb('p')); if (p) return 'p:' + p;
  const e = achar(camposComb('e')); if (e) return 'e:' + e;
  const f = achar(camposComb('f')); return f ? 'f:' + f : null;
}
function modeloProvavel(imp) { // pessoas com a empresa (nome ou CNPJ) no mesmo arquivo: Pessoas e Empresas
  const cab = [...(linhasImp(imp)[imp.cab] || [])].map(h => String(h ?? '')), pontos = m => new Set(cab.map(h => campoProvavel(m, h)).filter(Boolean));
  const c = pontos('combinado'), tem = (...ks) => ks.some(k => c.has(k));
  if (tem('p:nome', 'p:email') && tem('e:identificacao', 'e:nome_comercial', 'e:razao_social')) return 'combinado';
  const p = pontos('pessoas').size, e = pontos('empresas').size;
  return Math.max(p, e) < 2 ? 'livre' : p >= e ? 'pessoas' : 'empresas';
}
function tipoProvavel(titulo, vals) { // modelo livre: o tipo pelo cabeçalho ou pelos valores
  const t = chave(titulo), tem = (...w) => w.some(x => t.includes(x));
  if (tem('email', 'e mail')) return 'email';
  if (tem('cnpj')) return 'cnpj';
  if (tem('linkedin')) return 'linkedin';
  if (tem('telefone', 'celular', 'whatsapp', 'fone', 'phone')) return 'telefone';
  if (t === 'cep' || tem('codigo postal')) return 'cep';
  if (t === 'uf' || t === 'estado') return 'uf';
  if (tem('site', 'website', 'url')) return 'site';
  if (tem('empresa', 'razao social', 'nome fantasia', 'company')) return 'empresa';
  if (t === 'nome' || tem('nome completo', 'sobrenome', 'participante')) return 'nome';
  const v = vals.filter(Boolean);
  if (v.length >= 3) { const pct = f => v.filter(f).length / v.length; if (pct(emailOk) >= 0.8) return 'email'; if (pct(x => /^\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}$/.test(x)) >= 0.8) return 'cnpj'; }
  return 'texto';
}
function sugerir(imp) {
  const L = linhasImp(imp), cab = L[imp.cab] || [];
  let ncol = cab.length; for (let i = imp.cab + 1; i < Math.min(L.length, imp.cab + 300); i++) if (L[i]) ncol = Math.max(ncol, L[i].length);
  const temDados = i => { for (let j = imp.cab + 1; j < L.length; j++) if (L[j] && !vazio(L[j][i])) return true; return false; };
  const usados = new Set(); imp.mapa = [];
  for (let i = 0; i < ncol; i++) {
    const h = limpo(cab[i]); // o Sirius quebra o cabeçalho em linhas (<br>): no nome da coluna, vira espaço
    if (!h && !temDados(i)) continue; // coluna totalmente vazia
    const titulo = h || 'Coluna ' + colLetra(i);
    const m = { i, titulo, nome: titulo, destino: '$ignorar', tipo: 'texto', sugestao: null }; // toda coluna começa em Ignorar; o campo provável fica só como sugestão
    if (imp.modelo === 'livre') { m.tipo = tipoProvavel(m.titulo, exemplos(imp, i)); if (m.tipo !== 'texto') m.sugestao = m.tipo; }
    else { const k = campoProvavel(imp.modelo, m.titulo); if (k && !usados.has(k)) { m.sugestao = k; usados.add(k); } }
    imp.mapa.push(m);
  }
  imp.temPessoa = imp.mapa.some(m => /^p:(nome|email)$/.test(campoProvavel('combinado', m.titulo) || '')); // uma linha por pessoa
}
/* Lado de uma coluna mantida no modelo combinado: 'e' (empresa) ou 'p' (pessoa) */
function ladoProvavel(imp, i) {
  const f = imp.folhas[imp.planilha], t = chave((imp.mapa.find(m => m.i === i) || {}).titulo);
  if (f.agrupadas && f.agrupadas.size) return f.agrupadas.has(i) ? 'e' : 'p'; // no relatório do Sirius, só a empresa vem agrupada (rowspan)
  if (/\bpessoa\b/.test(t)) return 'p';
  if (/\bempresa(rial)?\b/.test(t)) return 'e';
  // sem agrupamento: é da empresa quando o valor não muda entre as linhas da mesma empresa
  const chaves = imp.mapa.filter(m => ['e:identificacao', 'e:nome_comercial', 'e:razao_social'].includes(m.destino)).map(m => m.i);
  if (!chaves.length) return 'p';
  const L = linhasImp(imp), visto = new Map(); let repetidas = 0;
  for (let j = imp.cab + 1; j < L.length; j++) {
    const l = L[j]; if (!linhaComDados(l)) continue;
    const k = chaves.map(c => limpo(l[c])).join('\u0001'); if (!k.replace(/\u0001/g, '')) continue;
    const v = limpo(l[i]);
    if (!visto.has(k)) { visto.set(k, v); continue; }
    repetidas++; if (visto.get(k) !== v) return 'p';
  }
  return repetidas ? 'e' : 'p';
}
/* Sugestão ainda disponível: a coluna está em Ignorar e o campo sugerido não foi escolhido em outra */
const sugestaoPendente = (imp, m) => !!m.sugestao && m.destino === '$ignorar' && (imp.modelo === 'livre' || !imp.mapa.some(x => x.destino === m.sugestao));
function manterOutras(imp) { // as colunas em Ignorar sem sugestão entram com o nome do arquivo, sem validar
  for (const m of imp.mapa) {
    if (m.destino !== '$ignorar' || sugestaoPendente(imp, m)) continue;
    if (imp.modelo === 'livre') { m.destino = '$usar'; m.tipo = 'texto'; }
    else m.destino = imp.modelo === 'combinado' ? (ladoProvavel(imp, m.i) === 'e' ? '$manterE' : '$manterP') : '$manter';
  }
}
const campoDe = (modelo, d) => modelo === 'combinado' ? (d[0] === 'f' ? CAMPOS_FIN : MODELOS[LADO[d[0]]].campos).find(f => f.key === d.slice(2)) : MODELOS[modelo].campos.find(f => f.key === d);
const rotuloDestino = (modelo, d) => modelo === 'livre' ? TIPOS[d] : (modelo === 'combinado' ? LADO_ROTULO[d[0]] : '') + campoDe(modelo, d).label;
function usarSugestao(m, tirarDeOutra) { // escolhe o campo sugerido; tirarDeOutra: se outra coluna já usa o campo, ela volta para Ignorar
  if (S.imp.modelo === 'livre') { m.destino = '$usar'; m.tipo = m.sugestao; return; }
  const outra = S.imp.mapa.find(x => x !== m && x.destino === m.sugestao);

}
