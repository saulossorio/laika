<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Laika">
  <title>Laika</title>
  <style>
    :root { --bg: #0b0d12; --fg: #f2f4f8; --muted: #8b93a7; --accent: #ffb454; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 40rem; padding: 2rem; text-align: center; }
    h1 { font-size: clamp(3rem, 12vw, 6rem); letter-spacing: -0.03em; color: var(--accent); }
    p { margin-top: 1rem; color: var(--muted); font-size: 1.125rem; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Laika</h1>
    <p>Página em construção.</p>
  </main>
</body>
</html>
