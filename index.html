.toc-title { margin-bottom: 6px; padding-left: 14px; font-weight: var(--weight-semibold); color: var(--foreground); }
.toc a { display: block; padding: 6px 12px; border-left: 2px solid var(--border); color: var(--muted-foreground); text-decoration: none; transition: color var(--dur-fast), border-color var(--dur) var(--ease); }
.toc a.sub { padding-left: 24px; }
.toc a:hover { color: var(--foreground); border-left-color: var(--border-strong); }
.toc a[aria-current="true"] { color: var(--brand-fg); border-left-color: var(--primary); font-weight: var(--weight-medium); }
@media (max-width: 1000px) {
  .with-toc { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .with-toc > .toc { order: -1; position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; max-height: none; }
  .toc-title { display: none; }
  .toc a, .toc a.sub { padding: 4px 12px; border: 1px solid var(--border); border-radius: var(--radius-pill); }
}

/* ---------- components/tour/tour.css ---------- */
/* Grin tour: a guided walk through a screen, one point at a time. A veil darkens the page except a cut-out around
   the point shown; the cut-out and the card slide from one step to the next. Created by tour.js. */
.tour { position: fixed; inset: 0; z-index: 120; pointer-events: none; opacity: 0; transition: opacity var(--dur) var(--ease); }
.tour.show { opacity: 1; }
/* strips around the cut-out hold the clicks; the cut-out lets them through while the step waits for an action */
.tour-block { position: fixed; pointer-events: auto; }
.tour-spot { position: fixed; pointer-events: none; border-radius: var(--radius-md); box-shadow: 0 0 0 3px var(--primary), 0 0 0 200vmax var(--overlay); transition: top var(--dur-slow) var(--ease), left var(--dur-slow) var(--ease), width var(--dur-slow) var(--ease), height var(--dur-slow) var(--ease); }
.tour-spot.none { box-shadow: 0 0 0 200vmax var(--overlay); }
.tour-spot.pulse { animation: tour-pulse 1.6s var(--ease-in-out) infinite; }
@keyframes tour-pulse { 0%, 100% { box-shadow: 0 0 0 3px var(--primary), 0 0 0 200vmax var(--overlay); } 50% { box-shadow: 0 0 0 7px var(--highlight), 0 0 0 200vmax var(--overlay); } }
.tour-card { position: fixed; display: flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 32px)); padding: 18px 20px 16px; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--popover); color: var(--foreground); box-shadow: var(--shadow-lg); pointer-events: auto; transition: top var(--dur-slow) var(--ease), left var(--dur-slow) var(--ease), opacity var(--dur-fast), transform var(--dur-fast) var(--ease); }
.tour-card.sheet { width: auto; }
.tour-card.swap { opacity: 0; transform: translateY(6px); }
.tour-card.nudge { animation: tour-nudge var(--dur-slow) var(--ease); }
@keyframes tour-nudge { 20% { transform: translateX(-6px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } 100% { transform: none; } }
.tour-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -6px -8px 0 0; }
.tour-count { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--brand-fg); font-variant-numeric: tabular-nums; }
.tour-card h2 { font-size: var(--text-lg); outline: none; }
.tour-card p { margin: 0; color: var(--muted-foreground); line-height: var(--leading-body); }
/* what the person does on the screen */
.tour-card .tour-action { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--brand-border); border-radius: var(--radius-sm); background: var(--brand-bg); color: var(--foreground); font-size: var(--text-sm); font-weight: var(--weight-semibold); }
.tour-action[hidden] { display: none; }
.tour-action svg { flex: none; color: var(--brand-fg); }
/* the answer to each attempt: info (how to go on), ok (task done), crit (the point is not on the screen) */
.tour-msg { display: grid; grid-template-rows: 0fr; margin-top: -10px; opacity: 0; transition: grid-template-rows var(--dur) var(--ease), opacity var(--dur) var(--ease), margin var(--dur) var(--ease); }
.tour-msg > div { overflow: hidden; }
.tour-msg.show { grid-template-rows: 1fr; margin-top: 0; opacity: 1; }
.tour-card .tour-msg p { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border: 1px solid var(--info-border); border-radius: var(--radius-sm); background: var(--info-bg); color: var(--foreground); font-size: var(--text-sm); }
.tour-msg svg { flex: none; margin-top: 2px; color: var(--info-fg); }
.tour-card .tour-msg.ok p { border-color: var(--ok-border); background: var(--ok-bg); } .tour-msg.ok svg { color: var(--ok-fg); }
.tour-card .tour-msg.crit p { border-color: var(--crit-border); background: var(--crit-bg); } .tour-msg.crit svg { color: var(--crit-fg); }
.tour-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.tour-actions .spacer { flex: 1 1 auto; }
.tour-actions .link { color: var(--muted-foreground); font-size: var(--text-sm); }
.tour-actions .btn[hidden] { display: none; }
.tour-actions .btn.waiting { opacity: .5; }
/* menus the person opens during the tour stay above the veil */
body.tour-open .menu, body.tour-open .popover { z-index: 125; }

/* ---------- components/combobox/combobox.css ---------- */
/* Grin combobox (also: autocomplete, select with search, multiselect, tag input).
   A text field that filters a list of options; pick one, or several when it is .multiple (each choice becomes a tag).
   Options can have a second line and be grouped. combobox.js handles filtering, keyboard and tags. */
.combobox { position: relative; width: 100%; min-width: 0; }
.combobox-control { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: var(--control-h); padding: 4px 40px 4px 10px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--field); box-shadow: var(--shadow-xs); cursor: text; transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
.combobox-control:hover { border-color: var(--muted-foreground); }
.combobox-control:focus-within { border-color: var(--ring); box-shadow: 0 0 0 4px var(--highlight); }
.combobox-control::after { content: ''; position: absolute; right: 16px; top: calc(var(--control-h) / 2 - 5px); width: 7px; height: 7px; border: solid var(--muted-foreground); border-width: 0 2px 2px 0; transform: rotate(45deg); transition: transform var(--dur) var(--ease); pointer-events: none; }
.combobox.open .combobox-control::after { transform: translateY(3px) rotate(-135deg); }
.combobox-input:focus-visible { outline: none; box-shadow: none; }
.combobox-input { flex: 1 1 80px; min-width: 80px; height: calc(var(--control-h) - 10px); border: 0; outline: 0; background: transparent; color: var(--foreground); font-size: var(--control-text); }
.combobox-tag { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 10px; border-radius: var(--radius-pill); background: var(--brand-bg); border: 1px solid var(--brand-border); color: var(--brand-fg); font-size: var(--text-sm); font-weight: var(--weight-medium); animation: grin-scale-in var(--dur) var(--ease-spring); }
.combobox-tag button { display: inline-grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: var(--radius-pill); background: transparent; color: inherit; }
.combobox-tag button:hover { background: var(--hover); }
.combobox-tag.leaving { animation: grin-scale-in var(--dur-fast) var(--ease) reverse forwards; }
/* Select: the same list without typing; the field shows the choice and the whole control opens it */
.combobox.listbox .combobox-input { cursor: pointer; caret-color: transparent; }
.combobox.listbox .combobox-control { cursor: pointer; }
.combobox.listbox .combobox-option[aria-selected="true"]::after { content: ''; position: absolute; right: 14px; top: 50%; width: 5px; height: 10px; margin-top: -7px; border: solid var(--brand-fg); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.combobox.listbox .combobox-option { position: relative; padding-right: 36px; }
.combobox-tag svg { width: 12px; height: 12px; }
.combobox-list { position: absolute; z-index: 80; top: calc(100% + 6px); left: 0; right: 0; display: none; flex-direction: column; gap: 2px; max-height: 320px; overflow: auto; margin: 0; padding: 6px; list-style: none; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--popover); box-shadow: var(--shadow-md); }
.combobox.open .combobox-list { display: flex; animation: grin-scale-in var(--dur) var(--ease); transform-origin: top; }
.combobox.closing .combobox-list { display: flex; animation: grin-fade var(--dur-fast) var(--ease) reverse forwards; pointer-events: none; }
.combobox-group { padding: 8px 10px 4px; font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted-foreground); }
.combobox-option { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background-color var(--dur-fast), color var(--dur-fast); }
.combobox-option small { font-size: var(--text-sm); color: var(--muted-foreground); }
/* Option with an icon: the icon on the left, label and second line beside it. The tone colors the icon only. */
.combobox-option.has-icon { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 10px; align-items: start; }
.combobox-option.has-icon > .combobox-icon { grid-row: 1 / span 2; margin-top: 1px; }
.combobox-option.has-icon > small { grid-column: 2; }
.combobox-icon { display: inline-grid; place-items: center; width: 20px; height: 20px; flex-shrink: 0; color: var(--muted-foreground); }
.combobox-icon svg { width: 18px; height: 18px; }
.combobox-icon.ok { color: var(--ok-fg); } .combobox-icon.warn { color: var(--warn-fg); } .combobox-icon.crit { color: var(--crit-fg); } .combobox-icon.info { color: var(--info-fg); } .combobox-icon.brand { color: var(--brand-fg); }
.combobox-control > .combobox-icon { margin-left: 4px; }
.combobox-option[aria-selected="true"] { background: var(--row-selected); color: var(--brand-fg); font-weight: var(--weight-medium); }
.combobox-option.active, .combobox-option:hover { background: var(--accent); }
.combobox-option mark { padding: 0; }
.combobox-empty { padding: 12px 10px; color: var(--muted-foreground); font-size: var(--text-sm); }

/* ---------- components/dropzone/dropzone.css ---------- */
/* Grin dropzone (also: file upload, drag and drop, arrastar arquivo). An area that accepts a dropped file and also opens
   the file picker. It says which formats are accepted. dropzone.js marks the drag-over state and reads the files. */
.dropzone { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 24px; border: 2px dashed var(--border-strong); border-radius: var(--radius-xl); background: var(--sidebar); text-align: center; transition: border-color var(--dur-fast), background-color var(--dur-fast), transform var(--dur) var(--ease); }
.dropzone > svg { box-sizing: content-box; width: 24px; height: 24px; padding: 12px; margin-bottom: 4px; border-radius: var(--radius-lg); background: var(--brand-bg); color: var(--brand-fg); }
.dropzone b { font-size: var(--text-base); }
.dropzone small { color: var(--muted-foreground); font-size: var(--text-sm); }
.dropzone input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.dropzone.over { border-color: var(--primary); background: var(--brand-bg); transform: scale(1.01); }
.dropzone:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.dropzone-file { animation: grin-rise var(--dur) var(--ease); display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.dropzone-file > svg { width: 20px; height: 20px; color: var(--muted-foreground); }
.dropzone-file b { display: block; } .dropzone-file small { color: var(--muted-foreground); font-size: var(--text-sm); }
.dropzone-file .btn { margin-left: auto; }

/* ---------- components/chart/chart.css ---------- */
/* Grin chart (also: gráfico, data viz, bar list, legenda). Styles for charts drawn in SVG by the product,
   plus two ready parts: a legend that names every series, and a list of horizontal bars for "how much of each".
   Colors come only from --chart-1, --chart-2, --chart-band and --chart-grid, plus the state tones. */
.chart { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid-line { stroke: var(--chart-grid); stroke-width: 1; }
.chart .axis { stroke: var(--border-strong); stroke-width: 1; }
.chart text { fill: var(--muted-foreground); font-family: var(--font-sans); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .series-1 { fill: none; stroke: var(--chart-1); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .series-2 { fill: none; stroke: var(--chart-2); stroke-width: 2; stroke-dasharray: 5 4; }
.chart .band { fill: var(--chart-band); }
.chart .point { fill: var(--chart-1); }
.chart-title { font-size: var(--text-base); font-weight: var(--weight-semibold); }
.chart-note { font-size: var(--text-sm); color: var(--muted-foreground); }

/* Legend: a swatch and a name for each series, in the order they appear */
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: var(--text-sm); color: var(--muted-foreground); }
.chart-legend li { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--chart-1); }
.chart-legend i.series-2 { background: none; border-top: 2px dashed var(--chart-2); border-radius: 0; height: 0; width: 16px; }
.chart-legend i.band { background: var(--chart-band); }
.chart-legend i.line { height: 3px; border-radius: 2px; width: 16px; }

/* Bar list: a label, a horizontal bar and the value, one per row. Use for shares and counts by category. */
.bar-list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.bar-list li { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: var(--text-sm); }
.bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--foreground); }
.bar-label small { display: block; color: var(--muted-foreground); }
.bar-track { height: 8px; border-radius: var(--radius-pill); background: var(--muted); overflow: hidden; }
.bar-track i { display: block; height: 100%; width: var(--value, 0%); border-radius: inherit; background: var(--chart-1); transition: width var(--dur-slow) var(--ease); }
.bar-track i.crit { background: var(--crit-solid); } .bar-track i.warn { background: var(--warn-solid); } .bar-track i.ok { background: var(--ok-solid); }
.bar-value { min-width: 48px; text-align: right; font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .bar-list li { grid-template-columns: minmax(0, 1fr) auto; } .bar-track { grid-column: 1 / -1; grid-row: 2; } }

/* ---------- components/formula/formula.css ---------- */
/* Grin formula (also: equação, cálculo, metodologia). How a number is calculated, for method and help pages.
   .formula shows the equation; .symbols explains each symbol with its current value; .breakdown lists the steps
   of the calculation with the value of each one and the total. */
.formula { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--sidebar); font-family: var(--font-mono); font-size: var(--text-lg); overflow-x: auto; }
.formula var { font-family: var(--font-sans); font-style: italic; font-weight: var(--weight-semibold); color: var(--brand-fg); }
.formula sub { font-size: 0.7em; }
.formula .op { color: var(--muted-foreground); }
.formula .result { font-family: var(--font-sans); font-weight: var(--weight-semibold); }

.symbols { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 8px 16px; margin: 0; align-items: baseline; }
.symbols dt { font-style: italic; font-weight: var(--weight-semibold); color: var(--brand-fg); }
.symbols dd { margin: 0; color: var(--muted-foreground); }
.symbols dd.value { color: var(--foreground); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; text-align: right; }

.breakdown { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; counter-reset: grin-breakdown; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.breakdown li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); counter-increment: grin-breakdown; }
.breakdown li::before { content: counter(grin-breakdown); display: grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-pill); background: var(--muted); color: var(--muted-foreground); font-size: var(--text-xs); font-weight: var(--weight-semibold); }
.breakdown li small { display: block; color: var(--muted-foreground); font-size: var(--text-sm); }
.breakdown .breakdown-value { font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; text-align: right; }
.breakdown li.total { counter-increment: none; border-bottom: 0; background: var(--brand-bg); }
.breakdown li.total::before { content: '='; background: var(--primary); color: var(--primary-foreground); }
.breakdown li.total .breakdown-value { font-size: var(--text-lg); color: var(--brand-fg); }

/* ---------- components/timeline/timeline.css ---------- */
/* Grin timeline (also: histórico, log de atividades, changelog, auditoria). Events in order, newest first:
   what happened, when, who or where, and, for edits, the value before and after. */
.timeline { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.timeline li { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 12px; padding-bottom: 20px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li:not(:last-child)::before { content: ''; position: absolute; left: 15px; top: 34px; bottom: 4px; width: 2px; border-radius: 2px; background: var(--border); }
.timeline-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--muted); color: var(--muted-foreground); }
.timeline-icon svg { width: 16px; height: 16px; }
.timeline-icon.ok { background: var(--ok-bg); color: var(--ok-fg); } .timeline-icon.crit { background: var(--crit-bg); color: var(--crit-fg); }
.timeline-icon.warn { background: var(--warn-bg); color: var(--warn-fg); } .timeline-icon.brand { background: var(--brand-bg); color: var(--brand-fg); }
.timeline-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-top: 5px; }
.timeline-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.timeline-head b { font-weight: var(--weight-semibold); }
.timeline-head time { color: var(--muted-foreground); font-size: var(--text-sm); white-space: nowrap; font-variant-numeric: tabular-nums; }
.timeline-body p { color: var(--muted-foreground); font-size: var(--text-sm); }
.timeline-change { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: var(--text-sm); }
.timeline-change s { color: var(--muted-foreground); text-decoration-color: var(--crit-border); }
.timeline-change ins { text-decoration: none; color: var(--foreground); font-weight: var(--weight-medium); background: var(--ok-bg); padding: 0 4px; border-radius: 3px; }

/* ---------- components/sidebar/sidebar.css ---------- */
/* Grin app shell: sidebar, top bar and content. The sidebar collapses to icons only;
   on narrow screens it becomes a strip at the top. (Folder kept as "sidebar" for history.) */
.app { display: flex; min-height: 100vh; }
.sidebar { position: sticky; top: 0; flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; width: var(--size-sidebar); height: 100vh; overflow-x: hidden; overflow-y: auto; padding: 20px 12px; transition: width var(--dur-slow) var(--ease), padding var(--dur-slow) var(--ease); background: var(--sidebar); border-right: 1px solid var(--border); }

/* In a short window the items keep their height and the sidebar scrolls */
.sidebar > * { flex-shrink: 0; }

/* Logo: the drawing fits a 24 × 24 px square, keeps its proportion and is centered in it (width and height of 24 px on the svg, with the drawing's viewBox) */
.app-logo { display: flex; align-items: center; gap: 0.45em; margin-bottom: 16px; padding: 6px 10px; color: var(--foreground); font-size: var(--text-xl); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-display); line-height: 1; text-decoration: none; }
.app-logo .tag { align-self: center; margin-left: 2px; letter-spacing: 0; }
.app-logo-mark { width: 24px; height: 24px; flex-shrink: 0; fill: var(--primary); }

.nav-heading { margin: 20px 0 6px; padding: 0 12px; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--muted-foreground); }
.nav-item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: var(--size-nav-item); padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--sidebar-foreground); font-size: var(--text-base); font-weight: var(--weight-medium); text-align: left; text-decoration: none; transition: background-color var(--dur-fast), color var(--dur-fast); }
.nav-item svg { width: 20px; height: 20px; color: var(--muted-foreground); transition: color var(--dur-fast); }
.nav-item:hover { background: var(--hover); color: var(--foreground); }
.nav-item[aria-current="page"] { background: var(--sidebar-active); color: var(--brand-fg); box-shadow: inset 0 0 0 1px var(--brand-border); }
.nav-item[aria-current="page"] svg { color: var(--brand-fg); }
.nav-item .label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { font-size: var(--text-sm); color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
/* Two levels of importance: the product's places above; help, settings and account at the bottom, smaller,
   quieter and set apart by a line. Inside the main list, .nav-divider separates groups without a title. */
.nav-divider { height: 1px; margin: 12px 8px; background: var(--border); }
/* Main action of the tool (optional), a .btn.primary right below the logo, as "Nova análise" */
.sidebar-action { width: 100%; margin: 0 0 14px; }
.sidebar.collapsed .sidebar-action { width: 48px; align-self: center; padding: 0; justify-content: center; }
.nav-item.small { height: 36px; gap: 10px; font-size: var(--text-sm); font-weight: var(--weight-regular); color: var(--muted-foreground); }
.nav-item.small svg { width: 18px; height: 18px; }
.nav-item.small:hover { color: var(--foreground); }
.sidebar-footer { display: flex; flex-direction: column; gap: 2px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
.sidebar-footer .account { margin-top: 10px; }

/* Sub-items: places inside a place (Empresas › Nova análise). A thin rail, the current one marked in brand green. */
.nav-sub { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 6px 21px; padding-left: 12px; border-left: 1px solid var(--border); }
.nav-sub .nav-item { height: 34px; padding: 0 10px; font-size: var(--text-sm); color: var(--muted-foreground); }
.nav-sub .nav-item[aria-current="page"] { background: transparent; box-shadow: none; color: var(--foreground); font-weight: var(--weight-semibold); }
.nav-sub .nav-item[aria-current="page"]::before { content: ''; position: absolute; left: -14px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--primary); }
.nav-sub .nav-item .dot { margin-left: auto; }
.sidebar.collapsed .nav-sub { display: none; }

/* Account card at the bottom of the sidebar */
.account { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); color: inherit; text-decoration: none; }
.account b { display: block; font-weight: var(--weight-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sidebar.collapsed .nav-heading { height: 1px; margin: 12px 8px; padding: 0; overflow: hidden; background: var(--border); color: transparent; }
.sidebar .label, .sidebar .nav-count { animation: grin-fade var(--dur-slow) var(--ease); }
.sidebar-search-icon { display: none; }

.sidebar-toggle { position: fixed; z-index: 11; top: 22px; left: calc(var(--size-sidebar) - 14px); display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); color: var(--muted-foreground); box-shadow: var(--shadow-sm); transition: left var(--dur-slow) var(--ease), color var(--dur-fast), transform var(--dur-fast) var(--ease); }

.sidebar.collapsed .app-logo { justify-content: center; padding: 6px 0; }

.app-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 10; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; height: var(--size-topbar); padding: 0 32px; border-bottom: 1px solid var(--border); background: var(--background); }

.page-content:has(> .app-footer) { flex: 1 0 auto; padding-bottom: 20px; }
.app-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-soft); color: var(--muted-foreground); font-size: var(--text-sm); }

/* ---------- components/start/start.css ---------- */
/* Grin start screen (also: tela inicial, home, welcome, primeira tela). The first screen of a tool, before there is data

   size, the content below it with the page width, and the signature at the bottom of the window. Only the description
   is limited to --size-prose, for line length. Nothing is centered in a narrow column, so the title and the content do
   not jump when the person moves to another screen.

.page-header .page-description, .start-screen-body .lead { max-width: var(--size-prose); }

.start-screen:has(> .start-screen-body > .dropzone) { display: flex; flex-direction: column; }

{
// Grin: theme, contrast, density and font scale. The person's choice is kept in localStorage.
// Theme: 'system' (no attribute: follows the OS), 'light' or 'dark'.
// Contrast is separate and works with either theme: 'system' (no attribute: follows prefers-contrast), 'more' or 'normal'.
// Markup hooks (no extra JS needed):
//   <select data-theme-select>               options: system, light, dark
//   <button data-set-theme="dark">           sets a theme
//   <button data-theme-toggle>               toggles light/dark; shows a sun ("Tema claro") in the dark theme and a moon ("Tema escuro") in the light theme
//   <button data-contrast-toggle>            turns high contrast on/off; aria-pressed shows the state (or a checkbox switch: checked)
//   <input type="radio" data-set-density value="comfortable|compact">
//   <input type="radio" data-set-scale value="100|112|125">  or  <input type="range" class="slider" data-set-scale min="100" max="125" data-stops="100,112.5,125">
//   (the slider moves freely while dragged and the font size changes once, on release, after it settles on a stop)
// ?theme=dark and ?contrast=more in the URL set them on load (handy to share a preview). ?theme=hc = high contrast.
// To avoid a flash of the wrong theme, also put the inline snippet from README.md in <head>.

const getContrast = () => read('contrast', 'system');

  const t = getTheme();
  if (t !== 'system') return t;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
};
const effectiveContrast = () => {
  const c = getContrast();
  if (c !== 'system') return c;
  return matchMedia('(prefers-contrast: more)').matches ? 'more' : 'normal';
};

function setTheme(theme) {
  if (theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', theme);
  write('theme', theme);

}
function setContrast(contrast) {
  if (contrast === 'system') root.removeAttribute('data-contrast'); else root.setAttribute('data-contrast', contrast);
  write('contrast', contrast);
  sync(); announce();
}
function setDensity(density) {
  if (density === 'compact') root.setAttribute('data-density', 'compact'); else root.removeAttribute('data-density');
  write('density', density);
  sync();
}
function setScale(scale) {
  if (scale === '100') root.removeAttribute('data-scale'); else root.setAttribute('data-scale', scale);
  write('scale', scale);
  sync();

// Brings every control on the page in line with the current choice.

  document.querySelectorAll('input[data-set-density]').forEach((el) => { el.checked = el.value === d; });

const c0 = getContrast(); if (c0 !== 'system') root.setAttribute('data-contrast', c0);

const s0 = read('scale', '100'); if (s0 !== '100') root.setAttribute('data-scale', s0);

// sync() replaces only the icon inside the button, which never matches the selector, so it does not loop.
const CONTROLS = '[data-theme-toggle], [data-theme-select], button[data-set-theme], [data-contrast-toggle], input[data-set-density], input[data-set-scale]';

// ---------- scripts/animations.js ----------
{
// Grin: reusable motion. Rules: short (120 to 220 ms), only as a response to an action, never hiding content.
// With "reduce motion" on, nothing moves and the end state shows at once.
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const duration = () => parseInt(cssVar('--dur'), 10) || 160;
const easing = () => cssVar('--ease') || 'ease-out';

// Briefly highlights something that changed (a saved row, a recalculated value).
function flash(el) {
  if (reducedMotion() || !el) return;
  el.animate([{ backgroundColor: cssVar('--highlight') }, { backgroundColor: 'transparent' }], { duration: 900, easing: 'ease-out' });
}

// Entrance of a new element (toast, item added to a list).
function enter(el, { y = 6 } = {}) {
  if (reducedMotion() || !el) return;
  el.animate([{ opacity: 0, transform: `translateY(${y}px)` }, { opacity: 1, transform: 'none' }], { duration: duration(), easing: easing() });
}

// Scrolls to an element, smooth only when motion is allowed.
function scrollToElement(el) {
  el?.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
}

// Closes a menu or any floating layer with the exit animation, then hides or removes it.
// closeMenu(el) hides it (el.hidden = true); closeMenu(el, { remove: true }) takes it out of the page.
function closeMenu(el, { remove = false } = {}) {
  if (!el) return;
  const done = () => { el.classList.remove('closing'); if (remove) el.remove(); else el.hidden = true; };
  if (reducedMotion()) { done(); return; }
  el.classList.add('closing');
  setTimeout(done, 140);
}
Object.assign(Grin, { reducedMotion, flash, enter, scrollToElement, closeMenu });
}

// ---------- components/popover/popover.js ----------
{
// Grin tooltip, popover and term.
// Tooltip: any element with data-tooltip="text" (usually an icon button that already has the same aria-label).
//   It hides on pointer out, focus out, click and scroll; a page that redraws under the pointer can call hideTip().
// Popover: <button data-popover="id" aria-expanded="false"> opens <div class="popover" id="id" role="dialog" aria-label="…">.
//   Click outside or Esc closes it; focus goes back to the button. The .term and .help-button use the same hook.

  const a = anchor.getBoundingClientRect(), r = el.getBoundingClientRect();

  let top = a.bottom + GAP;
  if (top + r.height > vh - GAP && a.top - r.height - GAP > GAP) top = a.top - r.height - GAP;
  const left = Math.min(Math.max(GAP, a.left + a.width / 2 - r.width / 2), vw - r.width - GAP);
  el.style.top = `${Math.round(top)}px`; el.style.left = `${Math.round(left)}px`;

  tip.textContent = target.dataset.tooltip;

document.addEventListener('pointerout', (e) => { if (e.target.closest?.('[data-tooltip]')) hideTip(); });
document.addEventListener('focusin', (e) => { const t = e.target.closest?.('[data-tooltip]'); if (t && t.matches(':focus-visible')) showTip(t); });

// A click, a scroll or a redraw that removes the element also hides the tooltip
document.addEventListener('pointerdown', hideTip);
window.addEventListener('scroll', hideTip, { passive: true, capture: true });

function close(returnFocus = false) {
  if (!open) return;
  // fades out before hiding (instant with reduced motion)
  const panel = open.panel;
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { panel.classList.add('closing'); setTimeout(() => panel.classList.remove('closing'), 140); }
  panel.classList.remove('open');

{
// Grin slider. For every input.slider: paints the filled part of the track (--fill), writes the value in the
// <output for="id"> next to it (data-format="percent" adds %) and marks the matching tick in .slider-ticks (data-value).
// Stepped slider: data-stops="100,112.5,125". The thumb follows the pointer freely while dragging (smooth, no jumps);
// on release it glides to the nearest stop. Arrow keys jump from stop to stop. The value read on "change" is

  const min = +el.min || 0, max = +el.max || 100;
  el.style.setProperty('--fill', `${((v - min) / (max - min)) * 100}%`);
  const field = el.closest('.slider-field');

    const v = from + (to - from) * e;
    el.value = v; paint(el, v);
    if (k < 1) requestAnimationFrame(step); else { el.value = to; paint(el); }
  };
  requestAnimationFrame(step);
}

// ---------- components/sidebar/sidebar.js ----------
{
// Grin sidebar: collapse to icons and expand again.
// Markup: <div class="app"><nav class="sidebar">…</nav>…</div>. The script adds a round toggle on the sidebar edge
// (or uses any [data-sidebar-toggle] button), remembers the choice (localStorage "grin-sidebar"), and collapses on its
// own below 1100 px when the person never chose. Collapsed, each item shows its name as a tooltip (popover.js).
// On phones (760 px and below) it becomes a drawer opened by a menu button at the top left; choosing an item closes it.
// A tool that redraws the sidebar (or the whole .app) with a script keeps all of this: the script watches the page,
// puts the toggle and the menu button back when they are gone, and applies the current state to the new sidebar.
// The tool does not set .collapsed itself.

const { icon } = Grin;
const KEY = 'grin-sidebar';
const read = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
const write = (v) => { try { localStorage.setItem(KEY, v); } catch { /* private mode */ } };

const bar = () => document.querySelector('.app > .sidebar');
const phone = () => matchMedia('(max-width: 760px)').matches; // there the sidebar is a strip or a drawer, never icons only
const wanted = () => (read() ? read() === 'collapsed' : matchMedia('(max-width: 1100px)').matches);
let menuOpen = false;

function apply() {
  const sidebar = bar(); if (!sidebar) return;
  const collapsed = wanted() && !phone();
  sidebar.classList.toggle('collapsed', collapsed);
  sidebar.classList.toggle('open', menuOpen);
  sidebar.closest('.app')?.classList.toggle('sidebar-collapsed', collapsed);
  sidebar.querySelectorAll('.nav-item, .account, .sidebar-action').forEach((el) => {
    const name = el.querySelector('.label, b, span')?.textContent.trim() || el.getAttribute('aria-label');
    if (collapsed && name) { el.dataset.tooltip = name; if (!el.textContent.trim() || el.querySelector('.label')) el.setAttribute('aria-label', name); } else delete el.dataset.tooltip;
  });
  document.querySelectorAll('.sidebar-toggle, [data-sidebar-toggle]').forEach((b) => {
    b.setAttribute('aria-expanded', String(!collapsed));
    b.setAttribute('aria-label', collapsed ? 'Expandir barra lateral' : 'Recolher barra lateral');
    const label = b.querySelector('.label'); if (label) label.textContent = collapsed ? 'Expandir barra' : 'Recolher barra';
  });
  const m = document.querySelector('.sidebar-menu-button');
  if (m) { m.setAttribute('aria-expanded', String(menuOpen)); m.setAttribute('aria-label', menuOpen ? 'Fechar menu' : 'Abrir menu'); }
  document.body.classList.toggle('sidebar-open', menuOpen);
}

// Adds the round toggle and, outside the documentation, the phone menu button, when the page does not have them
function addParts() {
  const sidebar = bar(); if (!sidebar) return;
  const id = sidebar.id || (sidebar.id = 'app-sidebar');
  if (!document.querySelector('.sidebar-toggle, [data-sidebar-toggle]')) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'sidebar-toggle' });
    b.innerHTML = icon('chevron-left', 16);
    b.setAttribute('aria-controls', id);
    sidebar.after(b);
  }
  if (!sidebar.matches('[data-docs-nav]') && !document.querySelector('.sidebar-menu-button')) {
    const m = Object.assign(document.createElement('button'), { type: 'button', className: 'sidebar-menu-button' });
    m.innerHTML = icon('sidebar', 20); m.setAttribute('aria-controls', id);
    sidebar.before(m);
  }
}

const openMenu = (on) => { menuOpen = on; apply(); };

function initSidebar() {
  if (!bar() || started) return;
  started = true;
  addParts(); apply();
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest?.('.sidebar-toggle, [data-sidebar-toggle]')) {
      write(bar()?.classList.contains('collapsed') ? 'expanded' : 'collapsed');
      apply(); return;
    }
    if (t.closest?.('.sidebar-menu-button')) { openMenu(!menuOpen); return; }
    // The drawer closes when the person clicks outside it or chooses a place in it (the small footer buttons, such as theme and Aparência, keep it open)
    if (menuOpen && (!t.closest?.('.sidebar') || t.closest('.sidebar .nav-item:not(.small), .sidebar .account, .sidebar .app-logo'))) openMenu(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && menuOpen) { openMenu(false); document.querySelector('.sidebar-menu-button')?.focus(); }
  });

  matchMedia('(max-width: 760px)').addEventListener('change', apply);

  // apply() changes attributes only, so it never triggers the observer again.
  const touches = (n) => n.nodeType === 1 && (n.matches('.sidebar, .sidebar-toggle, .sidebar-menu-button') || n.querySelector('.sidebar') || n.closest('.sidebar'));
  let queued = false;
  new MutationObserver((list) => {
    if (queued || !list.some((r) => [...r.addedNodes, ...r.removedNodes].some(touches) || r.target.closest?.('.sidebar'))) return;

// A sidebar drawn by a script after the page loads starts as soon as it appears.
const auto = () => {

  if (bar()) { initSidebar(); return; }
  const wait = new MutationObserver(() => { if (!bar()) return; wait.disconnect(); if (!document.querySelector('.sidebar[data-sidebar="manual"]')) initSidebar(); });
  wait.observe(document.body, { childList: true, subtree: true });
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', auto, { once: true }); else auto();
Object.assign(Grin, { initSidebar });
}

// ---------- components/dialog/dialog.js ----------
{
// Grin dialog and drawer behavior, for any <dialog class="dialog|drawer">.
// [data-open="id"] opens it as modal, [data-close] closes the dialog it is in. Esc and a click on the backdrop also close.
document.addEventListener('click', (e) => {
  const opener = e.target.closest?.('[data-open]');
  if (opener) { document.getElementById(opener.dataset.open)?.showModal(); return; }
  const closer = e.target.closest?.('[data-close]');
  if (closer) { closer.closest('dialog')?.close(); return; }
  if (e.target.tagName === 'DIALOG') e.target.close(); // click on the backdrop
});
}

// ---------- components/tabs/tabs.js ----------
{
// Grin tabs. Markup: [role=tablist] > button[role=tab][aria-controls=id]; panels [role=tabpanel][id].
// Click or Left/Right/Home/End selects a tab and shows its panel. A white piece (.tabs-indicator) slides to the chosen tab.
// Tabs as links (navigation between pages): <nav class="tabs"><a class="tab" href="…" aria-current="page">. No role, no panels;
// the indicator marks the current page.
document.addEventListener('click', (e) => { const tab = e.target.closest?.('[role="tab"]'); if (tab) select(tab); });

  const tab = e.target.closest?.('[role="tab"]');

  const tabs = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
  const i = tabs.indexOf(tab);
  const next = { ArrowLeft: tabs[(i - 1 + tabs.length) % tabs.length], ArrowRight: tabs[(i + 1) % tabs.length], Home: tabs[0], End: tabs.at(-1) }[e.key];
  e.preventDefault(); select(next); next.focus();
});

  const list = tab.closest('[role="tablist"]');

}
function place(list) {
  const on = list.querySelector('[role="tab"][aria-selected="true"], a.tab[aria-current="page"]');
  let bar = list.querySelector('.tabs-indicator');
  if (!on || !list.classList.contains('tabs')) return;
  if (!bar) { bar = document.createElement('span'); bar.className = 'tabs-indicator'; bar.setAttribute('aria-hidden', 'true'); list.prepend(bar); list.classList.add('tabs-ready'); }
  bar.style.width = `${on.offsetWidth}px`; bar.style.height = `${on.offsetHeight}px`;

addEventListener('resize', placeAll);
document.fonts?.ready.then(placeAll);
}

// ---------- components/toast/toast.js ----------
{
// Grin toast. toast('Text', { type: 'ok' | 'crit' | 'warn' | 'info', action: 'Desfazer', onAction: fn, duration: 5000 })
// Creates the .toasts region (role="status") on first use, so screen readers announce each message.
const { icon } = Grin;
const ICON = { ok: 'check-circle', crit: 'alert-circle', warn: 'alert-triangle', info: 'info' };

function toast(text, { type = 'ok', action, onAction, duration = 5000 } = {}) {
  let region = document.querySelector('.toasts');
  if (!region) {
    region = Object.assign(document.createElement('div'), { className: 'toasts' });
    region.setAttribute('role', 'status');
    document.body.append(region);
  }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${icon(ICON[type] ?? 'info')}<div class="toast-text"></div>${action ? '<button type="button" class="link"></button>' : ''}<button type="button" class="btn icon xs ghost" aria-label="Fechar aviso">${icon('x', 14)}</button>`;
  el.querySelector('.toast-text').textContent = text;
  // Fades out before leaving; with reduced motion the animation is off, so remove right away
  const close = () => { if (!el.isConnected) return; el.classList.add('leaving'); setTimeout(() => el.remove(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 220); };
  if (action) {
    const b = el.querySelector('.link');
    b.textContent = action;
    b.addEventListener('click', () => { onAction?.(); close(); });
  }
  el.querySelector('.btn').addEventListener('click', close);
  region.append(el);
  setTimeout(close, duration);
  return el;
}
Object.assign(Grin, { toast });
}

// ---------- components/accordion/accordion.js ----------
{
// Grin accordion and disclosure: animate opening and closing in every browser. Markup: .accordion > details > summary
// + .accordion-body, or details.disclosure > summary + one content element.
// Opening: the panel grows from 0 to its height while its content fades in and rises 4 px; closing does the reverse.
// The chevron turns at the same time (CSS). Without this script the <details> still opens and closes, just without motion.
// details with the same name="" stay exclusive: opening one closes the other with the same animation.
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR = 240, EASE = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
const running = new WeakMap();

// The whole <details> is animated (from the summary's height to summary + panel and back), not the panel itself:
// the panel has padding, so animating it to 0 left a 20 px jump at the end of every close.
function animate(details, open) {
  const summary = details.querySelector(':scope > summary');
  const body = details.querySelector(':scope > .accordion-body') || details.querySelector(':scope > :not(summary)');
  if (!summary || !body || reduce()) { details.open = open; return; }
  const current = running.get(details);
  const from = details.getBoundingClientRect().height; // where it is now, even in the middle of another animation
  current?.forEach((a) => a.cancel());
  if (open) details.open = true;
  const to = open ? summary.offsetHeight + body.offsetHeight : summary.offsetHeight;
  details.style.overflow = 'hidden';
  const size = details.animate([{ height: `${from}px` }, { height: `${to}px` }], { duration: DUR, easing: EASE });
  const fade = body.animate(
    [{ opacity: open ? 0 : 1, transform: `translateY(${open ? -4 : 0}px)` }, { opacity: open ? 1 : 0, transform: `translateY(${open ? 0 : -4}px)` }],
    { duration: DUR, easing: EASE, fill: 'forwards' },
  );
  running.set(details, [size, fade]);
  size.onfinish = () => {
    details.style.overflow = '';
    running.delete(details);
    if (!open) details.open = false;
    fade.cancel(); // drop the end state so the next opening starts clean
  };
}

document.addEventListener('click', (e) => {
  const summary = e.target.closest?.('.accordion summary, details.disclosure > summary');
  if (!summary) return;
  const details = summary.parentElement;
  e.preventDefault();
  // Open and not closing → close; closed, or in the middle of closing → open
  const opening = !details.open || details.dataset.closing === '1';
  details.dataset.closing = opening ? '' : '1';
  if (opening && details.name) {
    (details.closest('.accordion') || details.parentElement)?.querySelectorAll(`details[name="${CSS.escape(details.name)}"][open]`).forEach((d) => {
      if (d !== details && d.dataset.closing !== '1') { d.dataset.closing = '1'; animate(d, false); }
    });
  }
  animate(details, opening);
});
}

// ---------- components/combobox/combobox.js ----------

  };

    const q = fold(input.value.trim());

    move(visible().length ? 0 : -1, true);
  };

    const v = visible(); if (!v.length) return;

// ---------- components/dropzone/dropzone.js ----------
{
// Grin dropzone. Markup: <label class="dropzone"> … <input type="file" accept=".csv,.xlsx"> … </label>.
// Marks .over while a file is dragged on top and fires "grin:files" with the File list (from drop or from the picker).
document.querySelectorAll('.dropzone').forEach((zone) => {
  const input = zone.querySelector('input[type="file"]');
  const send = (files) => { if (files?.length) zone.dispatchEvent(new CustomEvent('grin:files', { bubbles: true, detail: [...files] })); };
  ['dragenter', 'dragover'].forEach((t) => zone.addEventListener(t, (e) => { e.preventDefault(); zone.classList.add('over'); }));
  ['dragleave', 'dragend'].forEach((t) => zone.addEventListener(t, (e) => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('over'); }));
  zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('over'); send(e.dataTransfer.files); });
  input?.addEventListener('change', () => send(input.files));
});
}

// ---------- components/glossary/glossary.js ----------
{
// Grin glossary. Markup: .glossary > .letter-index (buttons with data-letter, plus one with data-letter="" for all)
// and .glossary-group[data-letter] > .glossary-item. Optional search: <input data-glossary-search>.
document.querySelectorAll('.glossary').forEach((g) => {
  const groups = [...g.querySelectorAll('.glossary-group')];
  const search = g.querySelector('[data-glossary-search]');
  let letter = '';
  const apply = () => {
    const q = (search?.value ?? '').trim().toLowerCase();
    for (const grp of groups) {
      let any = false;
      for (const item of grp.querySelectorAll('.glossary-item')) {
        const show = (!letter || grp.dataset.letter === letter) && (!q || item.textContent.toLowerCase().includes(q));
        item.hidden = !show; any ||= show;
      }
      grp.hidden = !any;
    }
    g.querySelectorAll('.letter-index button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.letter === letter)));
  };
  g.querySelectorAll('.letter-index button').forEach((b) => {
    if (b.dataset.letter && !groups.some((grp) => grp.dataset.letter === b.dataset.letter)) b.disabled = true;
    b.addEventListener('click', () => { letter = b.dataset.letter; apply(); });
  });
  search?.addEventListener('input', apply);
  apply();
});
}

// ---------- components/toc/toc.js ----------
{
// Grin table of contents. Marks with aria-current="true" the link of the section being read.
// Markup: <nav class="toc" aria-label="Nesta página"><a href="#id">…</a></nav>; the sections need those ids.
document.querySelectorAll('.toc').forEach((toc) => {
  const links = [...toc.querySelectorAll('a[href^="#"]')];
  const sections = links.map((a) => document.getElementById(decodeURIComponent(a.hash.slice(1)))).filter(Boolean);
  const mark = (id) => links.forEach((a) => a.setAttribute('aria-current', String(a.hash.slice(1) === id)));
  const io = new IntersectionObserver((entries) => {
    const visible = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (visible[0]) mark(visible[0].target.id);
  }, { rootMargin: '0px 0px -70% 0px' });
  sections.forEach((s) => io.observe(s));
  if (sections[0]) mark(sections[0].id);
});
}

// ---------- components/tour/tour.js ----------

// Each step: { title, text, target, action, click, done }.
//   target: selector, function returning an element, or a list of them in order of preference; none = card in the center.
//   action: what the person does on the screen ("Clique em Empresas"). With it, the step can wait:
//   click: true waits for a click on the target, which goes on to the page; done: () => true when the task is done.
// A first step without target is the presentation: it is not counted and offers Começar and Agora não.
// The tour never changes the screen by itself. Outside the cut-out, clicks are held: the card shakes and says what to do.

      <div class="tour-top"><span class="tour-count"></span><button type="button" class="btn icon xs ghost" data-tour="end" aria-label="Sair do tour">${icon('x', 16)}</button></div>
      <div class="progress sm" aria-hidden="true"><i></i></div>
      <h2 id="tour-title" tabindex="-1"></h2><p id="tour-text"></p>
      <p class="tour-action" hidden></p>
      <div class="tour-msg" aria-live="polite"><div><p></p></div></div>
      <div class="tour-actions"><button type="button" class="link" data-tour="skip"></button><span class="spacer"></span>
        <button type="button" class="btn xs" data-tour="prev">${icon('arrow-left', 16)}Voltar</button><button type="button" class="btn xs" data-tour="retry" hidden>Tentar de novo</button><button type="button" class="btn xs primary" data-tour="next"></button></div>

    if (r) { const x2 = Math.min(vw - 4, f.x + f.w), y2 = Math.min(vh - 4, f.y + f.h); f.x = Math.max(4, f.x); f.y = Math.max(4, f.y); f.w = Math.max(0, x2 - f.x); f.h = Math.max(0, y2 - f.y); }

    else if (!r) { x = (vw - cw) / 2; y = (vh - ch) / 2; }
    else if (vh - (f.y + f.h) >= ch + 2 * m) { x = clamp(f.x + f.w / 2 - cw / 2, m, vw - cw - m); y = f.y + f.h + 14; }
    else if (f.y >= ch + 2 * m) { x = clamp(f.x + f.w / 2 - cw / 2, m, vw - cw - m); y = f.y - ch - 14; }
    else if (vw - (f.x + f.w) >= cw + 2 * m) { x = f.x + f.w + 14; y = clamp(f.y + f.h / 2 - ch / 2, m, vh - ch - m); }
    else if (f.x >= cw + 2 * m) { x = f.x - cw - 14; y = clamp(f.y + f.h / 2 - ch / 2, m, vh - ch - m); }

  const pre = 'linkedin.com/' + tipo + '/';
  const s = v.trim().replace(/^(https?:\/\/)?([a-z]{2,3}\.)?/i, '');
  if (!s.toLowerCase().startsWith(pre)) return 'LinkedIn inválido: use um endereço com ' + pre + '.';
  if (!s.split(/[?#]/)[0].replace(/\/+$/, '').slice(pre.length)) return 'LinkedIn inválido: falta o nome do perfil depois de ' + pre + '.';
  return '';
}
function erroSite(v) { // RN-FMT-005
  try { const u = new URL(/^https?:\/\//i.test(v) ? v : 'https://' + v); if (!u.hostname.includes('.')) throw 0; return ''; }
  catch (e) { return 'Site inválido: confira o endereço, por exemplo https://www.empresa.com.'; }
}
/* Domínios de e-mail pessoal (RN-PES-003) e usuários de e-mail de função (RN-PES-004), os mesmos no Canis e no Laika (D-58) */
const DOMINIOS_PESSOAIS = new Set(['gmail.com', 'googlemail.com', 'hotmail.com', 'hotmail.com.br', 'outlook.com', 'outlook.com.br', 'live.com', 'msn.com', 'yahoo.com', 'yahoo.com.br', 'ymail.com', 'icloud.com', 'me.com', 'mac.com', 'aol.com', 'bol.com.br', 'uol.com.br', 'terra.com.br', 'ig.com.br', 'protonmail.com', 'proton.me']);
const EMAILS_FUNCAO = new Set(['contato', 'info', 'eventos', 'comercial', 'marketing', 'rh', 'financeiro', 'suporte', 'atendimento', 'noreply', 'no-reply', 'vendas', 'sac', 'administrativo', 'faleconosco', 'ouvidoria']);
const UFS = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const UF_NOME = { acre: 'AC', alagoas: 'AL', amapa: 'AP', amazonas: 'AM', bahia: 'BA', ceara: 'CE', 'distrito federal': 'DF', 'espirito santo': 'ES', goias: 'GO', maranhao: 'MA', 'mato grosso': 'MT', 'mato grosso do sul': 'MS', 'minas gerais': 'MG', para: 'PA', paraiba: 'PB', parana: 'PR', pernambuco: 'PE', piaui: 'PI', 'rio de janeiro': 'RJ', 'rio grande do norte': 'RN', 'rio grande do sul': 'RS', rondonia: 'RO', roraima: 'RR', 'santa catarina': 'SC', 'sao paulo': 'SP', sergipe: 'SE', tocantins: 'TO' };
const ufDeNome = v => UF_NOME[chave(v)] || ''; // "Paraná" → "PR" (o Sirius escreve o estado por extenso)
/* Marcadores de vazio do Sirius: viram célula vazia ao carregar, com o original guardado em r.vaz (doc 10, migração) */
const MARCADORES_VAZIO = new Set(['-', '--', '.', '..', 'n/a', 'ni', 'n/i', '–', '—']);
const ehMarcador = v => MARCADORES_VAZIO.has(String(v ?? '').trim().toLowerCase());
const linhaComDados = l => !!l && l.some(v => !vazio(v) && !ehMarcador(v));
/* Vários valores na mesma célula, um por linha (o Sirius junta telefones e e-mails com <br>) */
const valoresDaCelula = v => String(v ?? '').split('\n').map(x => x.trim()).filter(Boolean);
/* Valores de um campo do tipo listas: separados por vírgula, ponto e vírgula ou quebra de linha */
const valoresDeLista = v => String(v ?? '').split(/[\n;,]+/).map(x => x.trim()).filter(Boolean);
/* Junta valores de lista sem repetir (sem diferenciar acentos e maiúsculas), separados por vírgula */
const juntarLista = vs => vs.filter((x, i) => vs.findIndex(y => norm(y) === norm(x)) === i).join(', ');
/* Espaços extras (RN-GER-003): no início ou no fim, repetidos e linhas em branco. A quebra de linha entre valores fica. */
const semEspacosExtras = v => String(v ?? '').replace(/[ \t ]+/g, ' ').replace(/ ?\r?\n ?/g, '\n').replace(/\n{2,}/g, '\n').trim();
/* País vazio conta como Brasil: CEP, UF e CNPJ seguem as regras do Brasil */
const ehPaisBrasil = v => ['', 'brasil', 'br', 'bra', 'brazil'].includes(norm(String(v ?? '').trim()));
/* Tipo da identificação: o informado ou, sem tipo, CNPJ para empresa do Brasil (RN-EMP-002) */
const tipoIdentDe = (tipo, brasil) => String(tipo ?? '').trim().toUpperCase() || (brasil ? 'CNPJ' : '');

/* Problemas de um valor, conforme o tipo do campo (doc 03). Vale para o Canis e para o Laika.
   campo: item de CAMPOS ou coluna com tipo, label, lista, prefixo e li.
   ctx, opcional: tipoIdent (tipo informado na linha), brasil (falso só quando o país é outro), emPessoas
   (o valor é de uma pessoa) e nomeCampo (nome do campo no Canis, para as mensagens).
   Devolve [{ tipo, nivel, rotulo, texto, acao }]. O nível é o do Canis: crítico impede salvar e importar.
   acao diz qual ferramenta resolve (separar, trocar, zeros).
   Valor vazio não gera problema: campo obrigatório é regra de uso de cada produto (D-09, D-58). */
function problemasDoValor(campo, bruto, ctx = {}) {
  const out = [], add = (tipo, nivel, rotulo, texto, acao) => out.push(acao ? { tipo, nivel, rotulo, texto, acao } : { tipo, nivel, rotulo, texto });
  bruto = String(bruto ?? '');
  const v = bruto.trim(), brasil = ctx.brasil !== false, nome = ctx.nomeCampo || campo.label; let e;
  if (bruto && bruto !== semEspacosExtras(bruto)) add('espacos', 'info', 'Espaços extras', 'Espaços no início ou no fim, repetidos ou linhas em branco (RN-GER-003).');
  if (!v) return out;
  if (TIPOS_UM_VALOR.has(campo.tipo) && v.includes('\n')) { // um aviso só, no lugar de "inválido"
    const n = valoresDaCelula(v).length;
    if (n > 1) { add('multi', 'atencao', 'Mais de um valor', 'A célula tem ' + n + ' valores, um por linha.', 'separar'); return out; }
  }
  switch (campo.tipo) {
    case 'email':
      if (!emailOk(v)) { add('email', 'critico', 'E-mail inválido', 'Formato de e-mail inválido.'); break; }
      if (DOMINIOS_PESSOAIS.has(dominioDe(v))) add('pessoal', ctx.emPessoas ? 'critico' : 'atencao', 'E-mail pessoal', dominioDe(v) + ' é um domínio de e-mail pessoal (RN-PES-003).');
      if (EMAILS_FUNCAO.has(usuarioDe(v))) add('funcao', 'atencao', 'E-mail de função', usuarioDe(v) + '@ é um endereço de função, não de uma pessoa (RN-PES-004).');
      break;
    case 'nome':
      if ((e = erroNome(v, campo.label))) add('nome', 'critico', 'Nome fora da regra', e);
      else if (v === v.toLocaleUpperCase('pt-BR') && /\p{L}{2}/u.test(v)) add('caixa', 'info', 'Nome em maiúsculas', 'Escrito todo em maiúsculas.');
      break;
    case 'ident': case 'cnpj': {
      const t = campo.tipo === 'cnpj' ? 'CNPJ' : tipoIdentDe(ctx.tipoIdent, brasil);
      if (t && (e = erroIdent(t, v))) add('ident', 'critico', 'Identificação inválida', e, t === 'CNPJ' && /^\d{11,13}$/.test(limparIdent(v)) ? 'zeros' : '');
      break;
    }
    case 'lista':
      if (!foraDaLista(campo.lista, v)) break;
      if (LISTAS_ABERTAS.has(campo.lista)) add('lista', 'info', 'Valor novo na lista', '“' + v + '” não está na lista de ' + nome + ': no Canis, entra como valor novo.', 'trocar');
      else add('lista', 'critico', 'Valor fora da lista', '“' + v + '” não está na lista de ' + nome + '. Aceitos: ' + LISTAS[campo.lista].join(', ') + '.', 'trocar');
      break;
    case 'listas': { // um ou mais valores da lista na célula (RN-EMP-007, RN-PES-012)
      const fora = valoresDeLista(v).filter(x => foraDaLista(campo.lista, x));
      if (fora.length) add('lista', 'critico', 'Valor fora da lista', fora.map(x => '“' + x + '”').join(', ') + (fora.length > 1 ? ' não estão' : ' não está') + ' na lista de ' + nome + '. Aceitos: ' + LISTAS[campo.lista].join(', ') + '.', 'trocar');
      break;
    }
    case 'telefone': { // RN-FMT-003
      const d = v.replace(/\D/g, ''), intl = /^(\+|00)/.test(v);
      const ok = intl ? d.length >= 8 && d.length <= 15 : d.length === 10 || d.length === 11 || ((d.length === 12 || d.length === 13) && d.startsWith('55'));
      if (!ok) add('telefone', 'atencao', 'Telefone a conferir', 'Telefone com ' + d.length + ' dígitos: confira o código de área e o número.');
      break;
    }
    case 'cep': if (brasil && v.replace(/\D/g, '').length !== 8) add('cep', 'atencao', 'CEP inválido', /^\d{5,7}$/.test(v) ? 'CEP com ' + v.length + ' dígitos: o Excel pode ter tirado os zeros à esquerda.' : 'CEP do Brasil tem 8 dígitos.'); break; // RN-FMT-002
    case 'uf': // sigla ou nome completo do estado valem (RN-FMT-002, dono do produto, 20/10/2026)
      if (!brasil || UFS.includes(v.toUpperCase()) || ufDeNome(v)) break;
      add('uf', 'atencao', 'UF inválida', 'Use a sigla ou o nome do estado, por exemplo SP ou São Paulo.');
      break;
    case 'site': if ((e = erroSite(v))) add('site', 'atencao', 'Site inválido', e); break;
    case 'linkedin': if ((e = erroLinkedIn(v, campo.li || (/\/company\//i.test(v) ? 'company' : 'in')))) add('linkedin', 'atencao', 'LinkedIn fora do padrão', e); break;
    case 'dominios': if (v.split(/[\s,;]+/).filter(Boolean).some(d => !/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(d))) add('dominios', 'atencao', 'Domínio inválido', 'Separe os domínios por vírgula, por exemplo empresa.com.br, empresa.com.'); break;
    case 'ano': if (!/^(19|20)\d\d$/.test(v)) add('ano', 'atencao', 'Ano inválido', 'Informe o ano com 4 dígitos.'); break;
    case 'simnao': if (simNaoDe(v) === null) add('simnao', 'atencao', 'Sim ou Não', 'Use Sim ou Não.'); break;
    case 'codigo': if (!new RegExp('^' + campo.prefixo + '-\\d{6}$', 'i').test(v)) add('codigo', 'atencao', 'Código fora do padrão', 'Use o formato ' + campo.prefixo + '-000123.'); break;
  }
  return out;
}

/* ---------- 5. Problemas da pessoa que comparam campos ----------
   v: valores da pessoa pelas chaves de CAMPOS.pessoas, com as colunas empresa_* da empresa ligada.
   conferidos: chaves que quem revisa marcou como certas; o aviso daquele campo não volta.
   daEmpresa, opcional: valores da empresa ligada, pelas chaves de CAMPOS.empresas. Sem ela, a pessoa não é
   comparada com a empresa (RN-PES-012).
   tem, opcional: diz se a tabela tem a coluna. Pessoa sem nome é erro nos dois produtos, também no Laika (RN-PES-007);
   sem a coluna, a falta aparece só no aviso da exportação. */

/* Relacionamento da pessoa contido no da empresa (RN-PES-012): cada valor da pessoa precisa existir na empresa.
   Empresa sem relacionamento conta como vazia. Devolve no máximo um problema, com os valores que faltam (faltam). */
function problemasDoRelacionamento(daPessoa, daEmpresa) {
  const p = valoresDeLista(daPessoa); if (!p.length) return [];
  const e = valoresDeLista(daEmpresa), naEmpresa = new Set(e.map(norm)), faltam = p.filter(x => !naEmpresa.has(norm(x)));
  if (!faltam.length) return [];
  return [{ tipo: 'relacionamento', nivel: 'critico', rotulo: 'Relacionamento que a empresa não tem', col: 'relacionamento', faltam, acao: 'relacionamento',
    texto: faltam.map(x => '“' + x + '”').join(', ') + (faltam.length > 1 ? ' não estão' : ' não está') + ' no relacionamento da empresa' + (e.length ? ' (' + e.join(', ') + ')' : ', que está vazio') + '. Cada relacionamento da pessoa precisa existir na empresa dela.' }];
}

function problemasDaPessoa(v, conferidos = [], daEmpresa = null, tem = () => true) {
  const out = [], g = k => String(v[k] ?? '').trim();
  if (tem('nome') && !g('nome')) out.push({ tipo: 'semNome', nivel: 'critico', rotulo: 'Pessoa sem nome', col: 'nome', texto: 'A pessoa está sem nome.', acao: 'semNome' });
  const empresa = g('empresa_codigo') || g('empresa_identificacao') || g('empresa_nome'), af = norm(g('afiliacao'));
  // afiliação coerente com a empresa informada (RN-VIN-001)
  if (af === 'sem empresa' && empresa) out.push({ tipo: 'afiliacao', nivel: 'atencao', rotulo: 'Afiliação a revisar', col: 'afiliacao', texto: 'Marcada como Sem empresa, mas há empresa informada.' });
  if (af === 'empresa' && !empresa) out.push({ tipo: 'afiliacao', nivel: 'atencao', rotulo: 'Afiliação a revisar', col: 'afiliacao', texto: 'Afiliação Empresa, mas sem nome, código ou identificação da empresa.' });
  // gênero oposto ao sexo de quase todas as pessoas com o mesmo primeiro nome (RN-PES-011)
  const gen = sexoDoGenero(g('genero'));
  if (gen && !conferidos.includes('genero')) {
    const n = sexoDoNome(g('nome'));
    if (n && n.sexo !== gen) out.push({ tipo: 'generoNome', nivel: 'atencao', rotulo: 'Gênero diferente do nome', col: 'genero', texto: 'No Censo 2010 do IBGE, ' + (n.pct >= 99 ? '99% ou mais' : n.pct + '%') + ' das pessoas com o nome ' + n.nome + ' são do sexo ' + (n.sexo === 'F' ? 'feminino' : 'masculino') + ', e o gênero aqui está ' + g('genero') + '.', acao: 'generoCerto' });
  }
  // cada relacionamento da pessoa precisa existir na empresa dela (RN-PES-012)
  if (daEmpresa) out.push(...problemasDoRelacionamento(g('relacionamento'), daEmpresa.tipo_relacionamento));
  return out;
}

/* "Não disponível" com motivo, que só vale fora do Brasil (RN-EMP-005) */
const identificacaoNaoDisponivel = v => norm(String(v.identificacao_status ?? '').trim()).startsWith('nao disponivel') && !ehPaisBrasil(v.pais) && !vazio(v.motivo_sem_identificacao);

/* Problemas da empresa nos dois produtos, também no Laika, onde os outros campos vazios não viram problema:
   empresa sem razão social (RN-EMP-001) e sem relacionamento (RN-EMP-007), decididos pelo dono do produto em 20/10/2026,
   que são críticos, e empresa sem identificação, que desde 21/10/2026 é só advertência (RN-EMP-001): a empresa é salva,
   mas sem a chave que reconhece a mesma empresa. "Não disponível" com motivo substitui a advertência (RN-EMP-005).
   tem, opcional: diz se a tabela tem a coluna; sem a coluna, não há problema (os obrigatórios ficam no aviso da exportação). */
function problemasDaEmpresa(v, tem = () => true) {
  const out = [];
  if (tem('razao_social') && vazio(v.razao_social)) out.push({ tipo: 'semRazaoSocial', nivel: 'critico', rotulo: 'Empresa sem razão social', col: 'razao_social', texto: 'A empresa está sem razão social.', acao: 'semRazaoSocial' });
  if (tem('tipo_relacionamento') && !valoresDeLista(v.tipo_relacionamento).length) out.push({ tipo: 'semRelacionamento', nivel: 'critico', rotulo: 'Empresa sem relacionamento', col: 'tipo_relacionamento', texto: 'A empresa precisa de pelo menos um relacionamento: ' + LISTAS.relacionamento.join(', ') + '.' });
  if (tem('identificacao') && vazio(v.identificacao) && !identificacaoNaoDisponivel(v)) {
    const br = ehPaisBrasil(v.pais);
    out.push({ tipo: 'semIdentificacao', nivel: 'atencao', rotulo: br ? 'Empresa sem CNPJ' : 'Empresa sem identificação', col: 'identificacao', texto: br ? 'A empresa está sem CNPJ. O Canis aceita, mas sem ele fica mais difícil achar duplicados.' : 'A empresa está sem identificação. O Canis aceita, mas sem ela fica mais difícil achar duplicados.', acao: 'semIdentificacao' });
  }
  return out;
}

/* Campos obrigatórios na importação do Canis (D-09, 08 §2): devolve as chaves vazias. Pessoa: nome, sobrenome e
   e-mail, e cargo quando há empresa; afiliação vazia não recusa, vira Pendente ou Empresa (08 §2). Empresa: nome
   comercial, razão social, país e relacionamento. A identificação deixou de ser obrigatória em 21/10/2026: vazia, vira
   advertência (RN-EMP-001, problemasDaEmpresa). Categoria é opcional (RN-EMP-006). O Laika usa só no aviso da exportação (D-58). */
function obrigatoriosVazios(ent, v) {
  const g = k => String(v[k] ?? '').trim(), falta = [];
  if (ent === 'pessoas') {
    for (const k of ['nome', 'sobrenome', 'email']) if (!g(k)) falta.push(k);
    if ((g('empresa_codigo') || g('empresa_identificacao') || g('empresa_nome')) && !g('cargo')) falta.push('cargo');
  } else if (ent === 'empresas') {
    for (const k of ['nome_comercial', 'razao_social', 'pais', 'tipo_relacionamento']) if (!g(k)) falta.push(k);
  } else if (ent === 'financeiro') { // a empresa pelo código, pela identificação ou pelo nome; métrica, ano, valor, moeda, fonte e confiança (D-17)
    if (!g('empresa_codigo') && !g('empresa_identificacao') && !g('empresa_nome')) falta.push('empresa_nome');
    for (const k of ['metrica', 'ano', 'valor', 'moeda', 'fonte', 'confianca']) if (!g(k)) falta.push(k);
  }
  return falta;
}

/* ---------- 6. Duplicados (RN-DUP-001 e RN-DUP-002) ---------- */
const chavePessoa = s => { const t = norm(s).replace(/[^a-z\s'-]+/g, ' ').split(/\s+/).filter(Boolean); return t.length >= 2 ? t.join(' ') : ''; };
const chaveEmpresa = s => norm(s).replace(/[^a-z0-9]+/g, ' ').replace(/\b(s a|ltda|ltd|me|epp|eireli|sa|inc|llc|corp|co|cia)\b/g, ' ').replace(/\s+/g, ' ').trim();
const chaveLinkedIn = s => { const m = /linkedin\.com\/(in|company)\/([^/?#\s]+)/i.exec(s); if (!m) return ''; try { return m[1].toLowerCase() + '/' + decodeURIComponent(m[2]).toLowerCase(); } catch (e) { return m[1].toLowerCase() + '/' + m[2].toLowerCase(); } };
const chaveSite = s => { if (!s) return ''; try { return new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { return ''; } };
const trigramas = s => { const t = new Set(); for (const w of s.split(' ')) { if (!w) continue; const p = '  ' + w + ' '; for (let i = 0; i < p.length - 2; i++) t.add(p.slice(i, i + 3)); } return t; };
/* Semelhança entre dois conjuntos de trigramas: parte comum sobre o total */
const semelhanca = (a, b) => { let inter = 0; for (const g of a) if (b.has(g)) inter++; return inter / (a.size + b.size - inter); };
/* Critério de duplicado por campo (dup em CAMPOS). Crítico impede salvar e importar no Canis (RN-DUP-001);
   atenção é aviso de possível duplicado (RN-DUP-002). chave devolve '' quando o valor não entra na comparação.
   No Canis, a identificação compara país, tipo e valor (RN-EMP-003), e o mesmo nome só conta com vínculo atual
   na mesma empresa (mesmaEmpresa). O Laika compara só o valor e procura o mesmo nome em todo o arquivo (D-58). */
const DUPLICIDADE = {
  email: { motivo: 'Mesmo e-mail', nivel: 'critico', chave: v => v.toLowerCase() },
  ident: { motivo: 'Mesma identificação', nivel: 'critico', chave: v => { const k = limparIdent(v); return k.length >= 5 ? k : ''; } },
  linkedin: { motivo: 'Mesmo LinkedIn', nivel: 'atencao', chave: chaveLinkedIn },
  site: { motivo: 'Mesmo site', nivel: 'atencao', chave: chaveSite },
  celular: { motivo: 'Mesmo celular', nivel: 'atencao', chave: v => { const x = v.replace(/\D/g, ''); return x.length >= 10 ? x.slice(-11) : ''; } },
  nome: { motivo: 'Mesmo nome', nivel: 'atencao', chave: chavePessoa, mesmaEmpresa: true },
  empresa: { motivo: 'Nome semelhante', nivel: 'atencao', chave: chaveEmpresa, tamanhoMinimo: 3, semelhancaMinima: 0.6 },
};

   NOMES_SEXO: primeiros nomes com 1.000 pessoas ou mais no Censo 2010 e pelo menos 95% delas de um sexo,
